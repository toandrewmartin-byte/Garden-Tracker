<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patio Garden</title>
<meta name="theme-color" content="#D3E9F7">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patio Garden">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#EEF5EC; --paper:#FFFDF8; --ink:#33503F; --ink-soft:#5B7565;
  --mint:#CDE9D6; --leaf:#8FCB9F; --leaf-deep:#3F7A55;
  --blossom:#F8D3DD; --butter:#FCEBB0; --sky:#D3E9F7; --sky-deep:#9CCDEB;
  --lavender:#E0D6F3; --peach:#F9D9C3; --frost:#CFE8FA;
  --coral:#F6B9B2; --coral-soft:#FDEBE8; --coral-ink:#9F4239;
  --display:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.45 var(--body);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{font:inherit;color:inherit}
h1,h2{font-family:var(--display);margin:0}
.ic{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:middle}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}

/* hero scene */
.hero{margin-top:max(12px,env(safe-area-inset-top));border-radius:30px;overflow:hidden;background:var(--sky);line-height:0}
.hero svg{display:block;width:100%;height:auto}
.can{transform-box:fill-box;transform-origin:75% 90%}
.pouring .can{animation:pour 1.2s ease-in-out}
@keyframes pour{0%{transform:rotate(0)}30%{transform:rotate(-26deg)}70%{transform:rotate(-26deg)}100%{transform:rotate(0)}}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 4px 0}
h1{font-weight:600;font-size:30px;line-height:1.1}
.date{margin:2px 0 0;color:var(--ink-soft);font-size:15px}
.me{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--mint);
  border-radius:999px;padding:6px 12px;font:600 14px var(--body);cursor:pointer;min-height:40px;max-width:42%}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lede{font:500 20px/1.3 var(--display);margin:8px 4px 0}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;
  border:0;border-radius:999px;font:500 16px var(--display);cursor:pointer;background:var(--mint);
  box-shadow:0 2px 0 rgba(63,122,85,.18)}
.pill:active{transform:translateY(1px);box-shadow:none}
.pill .ic{width:24px;height:24px}
.pill.sky{background:var(--sky-deep)}
.pill.butter{background:var(--butter)}
.pill.primary{background:var(--leaf)}
.pill.danger{background:var(--coral)}
.pill.ghost{background:var(--mint)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border-radius:999px;padding:4px;margin:18px 0 6px}
.tab{border:0;background:none;border-radius:999px;min-height:42px;font:500 17px var(--display);cursor:pointer;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--mint);color:var(--ink)}

.banner{border-radius:20px;padding:10px 14px;margin:12px 0;font-size:15px;background:var(--butter)}
.banner.warn{background:var(--blossom)}
.banner button{margin-left:6px}

h2{font-weight:600;font-size:21px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.count{font:600 14px var(--body);background:var(--paper);border-radius:999px;padding:1px 10px;color:var(--ink-soft)}

/* plant cards */
.plant{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:center;background:var(--paper);
  border:2px solid transparent;border-radius:28px;padding:12px;margin-bottom:12px;box-shadow:0 3px 0 rgba(63,122,85,.14)}
.plant.thirsty{background:var(--coral-soft);border-color:var(--coral)}
.plant-main{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.badge{position:relative;flex:none;width:64px;height:64px;border-radius:50%;background:var(--tone,var(--mint));display:grid;place-items:center}
.badge .ic{width:44px;height:44px}
.frost-dot{position:absolute;top:-4px;right:-4px;width:26px;height:26px;border-radius:50%;background:var(--frost);
  border:2px solid var(--paper);display:grid;place-items:center}
.frost-dot .ic{width:14px;height:14px}
.txt{display:flex;flex-direction:column;min-width:0}
.name{font:600 19px/1.2 var(--display)}
.status{font-weight:700;font-size:15px;color:var(--leaf-deep)}
.thirsty .status{color:var(--coral-ink)}
.sub{font-size:13.5px;color:var(--ink-soft)}
.water-btn{width:58px;height:58px;border-radius:50%;border:2px solid var(--sky-deep);background:var(--sky);cursor:pointer;
  display:grid;place-items:center;box-shadow:0 2px 0 rgba(63,122,85,.18)}
.water-btn .ic{width:30px;height:30px}
.thirsty .water-btn{background:var(--sky-deep)}
.water-btn:active{transform:translateY(1px) scale(.96);box-shadow:none}
.more{grid-column:1/-1;margin-top:12px;padding-top:12px;border-top:2px dotted var(--mint);display:grid;gap:8px;font-size:15px}
.more p{margin:0;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;font:600 13px var(--body);background:var(--tone,var(--mint))}
.chip.frost{background:var(--frost)}
.chip .ic{width:14px;height:14px}
.edit{justify-self:start;min-height:40px;padding:6px 16px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:22px 4px 0}
.cyc-annual{--tone:var(--butter)} .cyc-perennial{--tone:var(--mint)} .cyc-tender-perennial{--tone:var(--peach)}
.cyc-tree{--tone:var(--lavender)} .cyc-unsure{--tone:var(--blossom)}

.empty{text-align:center;background:var(--paper);border-radius:28px;padding:22px 18px;margin-bottom:12px;color:var(--ink-soft)}
.empty .ic{width:56px;height:56px;margin-bottom:4px}
.empty strong{display:block;font:600 19px var(--display);color:var(--ink)}

.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:10px 4px;border-bottom:2px dotted var(--mint)}
.lg{width:40px;height:40px;border-radius:50%;background:var(--sky);display:grid;place-items:center}
.lg.rain{background:var(--butter)}
.lg .ic{width:26px;height:26px}
.log small{display:block;color:var(--ink-soft);font-size:13.5px}


.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:5;
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 24px);font-size:15px}
.toast .pill{min-height:36px;padding:4px 14px;font-size:15px;background:var(--butter);color:var(--ink);box-shadow:none}

/* dialogs */
dialog{border:0;border-radius:30px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--paper);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(51,80,63,.4)}
.sheet{display:grid;gap:14px;padding:20px}
.sheet h2{margin:0;font-size:24px}
.field{display:grid;gap:4px;border:0;padding:0;margin:0;min-width:0}
.field>span,.field>legend,.three label>span{font-weight:700;font-size:14.5px;padding:0}
.field legend{margin-bottom:4px}
input[type=text],input:not([type]),input[type=number],input[type=date],select,textarea{
  width:100%;font:inherit;color:inherit;padding:10px 12px;border-radius:16px;border:2px solid var(--mint);background:#fff;min-height:44px}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*,.three>*{min-width:0}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.three label{display:grid;gap:4px;align-content:start}
.three small,.hint{font-size:13px;color:var(--ink-soft);margin:0}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--leaf-deep)}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ico{position:relative;display:block}
.ico input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ico span{display:grid;place-items:center;height:56px;border-radius:18px;background:var(--mist);border:2px solid transparent}
.ico .ic{width:38px;height:38px}
.ico input:checked+span{background:var(--mint);border-color:var(--leaf-deep)}
.ico input:focus-visible+span{outline:3px solid var(--sky-deep);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions.left{justify-content:flex-start}
.grow{flex:1}

@media (max-width:380px){.three{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script src="firebase-config.js"></script>
<script>
(function () {
'use strict';

const FIREBASE_CONFIG = window.FIREBASE_CONFIG || {};

const FIREBASE_VERSION = '10.14.1';
const configured = !!FIREBASE_CONFIG.apiKey && !/^PASTE/.test(FIREBASE_CONFIG.apiKey);
const WHO_KEY = 'patio-garden-who';
const CODE_KEY = 'patio-garden-code';

/* ---------- starter plants (from your tracker) ---------- */
const SEED = [
  {name:'Clover', icon:'clover', lifeCycle:'Perennial', frost:false, planted:'2026-09-05', location:'', everyEstablishing:2, establishDays:28, everyEstablished:7, lastWatered:'2026-09-20',
   notes:'White clover. Planted date is approximate (about 2 weeks old on 9/20). Keep evenly moist while seedlings are young, then switch to deep, less frequent watering.'},
  {name:'Phlox', icon:'phlox', lifeCycle:'Perennial', frost:false, planted:'2026-09-10', location:'', everyEstablishing:5, establishDays:21, everyEstablished:7, lastWatered:'2026-09-20',
   notes:'Creeping blue phlox. Water the soil, not the leaves. Dies back in winter, and needs no watering while dormant.'},
  {name:'Mexican oregano', icon:'oregano', lifeCycle:'Tender perennial', frost:true, planted:'2026-09-20', location:'Sunny end, dries fastest', everyEstablishing:3, establishDays:28, everyEstablished:7, lastWatered:'2026-09-20',
   notes:'Cover or cut back before the first hard freeze. Leaves are damaged near 29°F and roots survive to about 20°F. Good drainage matters.'},
  {name:'Tuscan Blue rosemary', icon:'rosemary', lifeCycle:'Perennial', frost:false, planted:'2026-09-20', location:'By the drain', everyEstablishing:4, establishDays:28, everyEstablished:10, lastWatered:'2026-09-20',
   notes:'Let the soil dry between waterings. Overwatering causes root rot. Cover during a hard freeze this first winter.'},
  {name:'Silver Edge thyme', icon:'thyme', lifeCycle:'Perennial', frost:false, planted:'2026-09-20', location:'Dry spot: go easy on water nearby', everyEstablishing:4, establishDays:28, everyEstablished:7, lastWatered:'2026-09-20',
   notes:'Rots in soggy soil. Water when the top of the soil is dry.'},
  {name:'Sweet basil', icon:'basil', lifeCycle:'Annual', frost:true, planted:'2026-09-20', location:'', everyEstablishing:2, establishDays:14, everyEstablished:2, lastWatered:'2026-09-20',
   notes:'Harvest or cover on nights near freezing. Water at the base, ideally in the morning. Pinch off flower buds to keep it leafy.'},
  {name:'Cilantro', icon:'cilantro', lifeCycle:'Annual', frost:false, planted:'2026-09-20', location:'', everyEstablishing:2, establishDays:14, everyEstablished:4, lastWatered:'2026-09-20',
   notes:'Cool-season herb that bolts above about 85°F. Tolerates light frost; cover with frost cloth near 20°F.'},
  {name:'Garlic chives', icon:'chives', lifeCycle:'Perennial', frost:false, planted:'2026-09-20', location:'Shady end of the row', everyEstablishing:3, establishDays:21, everyEstablished:7, lastWatered:'2026-09-20',
   notes:'Toxic to dogs and cats. Keep pets out of this bed. Harvest often, and do not cut to the ground.'},
  {name:'Meyer lemon tree', icon:'lemon', lifeCycle:'Perennial', frost:true, planted:'2025-01-05', location:'', everyEstablishing:7, establishDays:28, everyEstablished:7, lastWatered:'2026-09-14',
   notes:'Water deeply and let the top few inches dry between waterings. Bring potted trees indoors by about first frost, or cover in-ground trees with frost cloth. Add the real planting date, and whether it lives in a pot or the ground.'}
];

const ICONS = [['sprout','Sprout'],['clover','Clover'],['phlox','Flower'],['oregano','Oregano'],['rosemary','Rosemary'],
  ['thyme','Thyme'],['basil','Basil'],['cilantro','Cilantro'],['chives','Chives'],['lemon','Lemon']];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'plant';
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmt(new Date());
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), b => (b % 36).toString(36)).join('');
const cleanCode = s => String(s || '').trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
const cycClass = c => 'cyc-' + String(c || 'Unsure').toLowerCase().replace(/\s+/g, '-');
const openD = d => { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); };
const closeD = d => { if (d.close) d.close(); else d.removeAttribute('open'); };

/* ---------- state ---------- */
let plants = [], logs = [], store = null, ready = false, view = 'plants', pendingUndo = null, toastTimer = null;
const openIds = new Set();
const byId = id => plants.find(p => p.id === id);

/* ---------- watering math ---------- */
function schedule(p) {
  const t = today();
  const age = p.planted ? diff(p.planted, t) : 9999;
  const settling = age < (p.establishDays == null ? 28 : p.establishDays);
  const every = Math.max(1, Number(settling ? p.everyEstablishing : p.everyEstablished) || 3);
  const base = p.lastWatered || p.planted || t;
  const next = addDays(base, every);
  const days = diff(t, next);
  return { age, settling, every, next, days, thirsty: days <= 0 };
}
const ago = day => {
  if (!day) return 'not yet';
  const n = diff(day, today());
  return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago';
};
const when = ts => {
  const d = new Date(ts), n = diff(fmt(d), today());
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (n <= 0) return 'Today, ' + time;
  if (n === 1) return 'Yesterday, ' + time;
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + time;
};

/* ---------- storage: preview mode (this device only) ---------- */
function createLocalStore() {
  const KEY = 'patio-garden-preview-v1';
  let db = null;
  try { db = JSON.parse(ls.get(KEY) || 'null'); } catch (e) { db = null; }
  if (!db) db = { plants: SEED.map(s => Object.assign({ id: slug(s.name) }, s)), log: [] };
  const save = () => ls.set(KEY, JSON.stringify(db));
  let onP = () => {}, onL = () => {};
  const emit = () => { save(); onP(db.plants.slice()); onL(db.log.slice().sort((a, b) => b.at - a.at)); };
  return {
    mode: 'local',
    start(p, l) { onP = p; onL = l; emit(); },
    savePlant(p) {
      const id = p.id || (slug(p.name) + '-' + Math.random().toString(36).slice(2, 6));
      const rec = Object.assign({}, p, { id });
      const i = db.plants.findIndex(x => x.id === id);
      if (i >= 0) db.plants[i] = rec; else db.plants.push(rec);
      emit(); return id;
    },
    patchPlants(map) {
      Object.keys(map).forEach(id => { const p = db.plants.find(x => x.id === id); if (p) Object.assign(p, map[id]); });
      emit();
    },
    deletePlant(id) { db.plants = db.plants.filter(p => p.id !== id); emit(); },
    addLog(e) {
      const id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      db.log.unshift(Object.assign({ id, at: Date.now() }, e));
      db.log = db.log.slice(0, 100); emit(); return id;
    },
    deleteLog(id) { db.log = db.log.filter(l => l.id !== id); emit(); }
  };
}

/* ---------- storage: Firebase (shared between phones) ---------- */
async function createFirebaseStore(code) {
  const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION;
  const mods = await Promise.all([import(base + '/firebase-app.js'), import(base + '/firebase-firestore.js')]);
  const fb = mods[1];
  const app = mods[0].initializeApp(FIREBASE_CONFIG);
  const db = fb.getFirestore(app);
  const plantsCol = fb.collection(db, 'gardens', code, 'plants');
  const logCol = fb.collection(db, 'gardens', code, 'log');
  const metaRef = fb.doc(db, 'gardens', code);
  const onErr = e => showError(e);
  const seedIfNew = () => fb.getDoc(metaRef).then(m => {
    if (m.exists()) return;
    const b = fb.writeBatch(db);
    SEED.forEach(p => b.set(fb.doc(plantsCol, slug(p.name)), p));
    b.set(metaRef, { seeded: true });
    return b.commit();
  }).catch(onErr);
  return {
    mode: 'firebase',
    start(onP, onL) {
      let seedChecked = false;
      fb.onSnapshot(plantsCol, snap => {
        onP(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
        // First run in a brand-new garden: add the starter plants once.
        if (!seedChecked && !snap.metadata.fromCache) { seedChecked = true; if (snap.empty) seedIfNew(); }
      }, onErr);
      fb.onSnapshot(fb.query(logCol, fb.orderBy('at', 'desc'), fb.limit(100)), snap => onL(snap.docs.map(d => {
        const x = d.data({ serverTimestamps: 'estimate' });
        return Object.assign({ id: d.id }, x, { at: x.at && x.at.toMillis ? x.at.toMillis() : Date.now() });
      })), onErr);
    },
    savePlant(p) {
      const data = Object.assign({}, p); delete data.id;
      const ref = p.id ? fb.doc(plantsCol, p.id) : fb.doc(plantsCol);
      fb.setDoc(ref, data).catch(onErr); return ref.id;
    },
    patchPlants(map) {
      const b = fb.writeBatch(db);
      Object.keys(map).forEach(id => b.update(fb.doc(plantsCol, id), map[id]));
      b.commit().catch(onErr);
    },
    deletePlant(id) { fb.deleteDoc(fb.doc(plantsCol, id)).catch(onErr); },
    addLog(e) { const ref = fb.doc(logCol); fb.setDoc(ref, Object.assign({}, e, { at: fb.serverTimestamp() })).catch(onErr); return ref.id; },
    deleteLog(id) { fb.deleteDoc(fb.doc(logCol, id)).catch(onErr); }
  };
}

/* ---------- rendering ---------- */
function scored() {
  return plants.map(p => ({ p, s: schedule(p) }))
    .sort((a, b) => a.s.days - b.s.days || String(a.p.name).localeCompare(String(b.p.name)));
}

function emptyBox(icon, title, text) {
  return '<div class="empty"><svg class="ic"><use href="#i-' + icon + '"/></svg><strong>' + esc(title) + '</strong>' + esc(text) + '</div>';
}

function card(p, s) {
  const open = openIds.has(p.id);
  const late = -s.days;
  const status = s.days < 0 ? 'Thirsty, ' + late + ' day' + (late === 1 ? '' : 's') + ' late'
    : s.days === 0 ? 'Water today' : s.days === 1 ? 'Water tomorrow' : 'Water in ' + s.days + ' days';
  const settle = s.settling ? 'settling in (day ' + Math.max(1, s.age + 1) + ' of ' + p.establishDays + ')' : 'settled in';
  const icon = ICONS.some(i => i[0] === p.icon) ? p.icon : 'sprout';
  let more = '';
  if (open) {
    more = '<div class="more">' +
      '<div class="chips"><span class="chip ' + cycClass(p.lifeCycle) + '">' + esc(p.lifeCycle || 'Unsure') + '</span>' +
      (p.frost ? '<span class="chip frost"><svg class="ic"><use href="#i-frost"/></svg>Needs frost cover</span>' : '') + '</div>' +
      (p.location ? '<p><b>Where:</b> ' + esc(p.location) + '</p>' : '') +
      '<p><b>Last watered:</b> ' + ago(p.lastWatered) + '</p>' +
      (p.notes ? '<p>' + esc(p.notes) + '</p>' : '') +
      '<button class="pill ghost edit" data-act="edit">Edit plant</button></div>';
  }
  return '<article class="plant ' + cycClass(p.lifeCycle) + (s.thirsty ? ' thirsty' : '') + '" data-id="' + esc(p.id) + '">' +
    '<button class="plant-main" data-act="toggle" aria-expanded="' + open + '">' +
      '<span class="badge"><svg class="ic"><use href="#i-' + icon + '"/></svg>' +
      (p.frost ? '<span class="frost-dot" title="Needs frost protection"><svg class="ic"><use href="#i-frost"/></svg></span>' : '') + '</span>' +
      '<span class="txt"><span class="name">' + esc(p.name) + '</span><span class="status">' + status + '</span>' +
      '<span class="sub">Every ' + s.every + ' day' + (s.every === 1 ? '' : 's') + ', ' + settle + '</span></span>' +
    '</button>' +
    '<button class="water-btn" data-act="water" aria-label="Water ' + esc(p.name) + '"><svg class="ic"><use href="#i-drop"/></svg></button>' +
    more + '</article>';
}

function plantsView(sc) {
  if (!ready) return '<div class="empty">Loading your garden…</div>';
  if (!sc.length) return emptyBox('sprout', 'Your garden is empty', 'Tap Add plant to start your garden.');
  const th = sc.filter(x => x.s.thirsty), rest = sc.filter(x => !x.s.thirsty);
  let h = '<h2>Thirsty now <span class="count">' + th.length + '</span></h2>';
  h += th.length ? th.map(x => card(x.p, x.s)).join('') : emptyBox('ladybug', 'Nobody is thirsty', 'Everyone has had a drink for now.');
  if (rest.length) h += '<h2>Coming up <span class="count">' + rest.length + '</span></h2>' + rest.map(x => card(x.p, x.s)).join('');
  h += '<div class="legend" aria-label="Color key">' +
    ['Annual','Perennial','Tender perennial','Tree'].map(c => '<span class="chip ' + cycClass(c) + '">' + c + '</span>').join('') +
    '<span class="chip frost"><svg class="ic"><use href="#i-frost"/></svg>Needs frost cover</span></div>';
  return h;
}

function logView() {
  if (!logs.length) return emptyBox('drop', 'No waterings yet', 'Tap a droplet when you water and it shows up here.');
  return '<ul class="log">' + logs.map(e => {
    const who = e.by || 'Someone';
    const text = e.type === 'rain' ? esc(who) + ' counted the rain for ' + (e.plants || 'all') + ' plants'
      : esc(who) + ' watered ' + esc(e.plantName || 'a plant');
    return '<li><span class="lg ' + esc(e.type) + '"><svg class="ic"><use href="#i-' + (e.type === 'rain' ? 'rain' : 'drop') + '"/></svg></span>' +
      '<span>' + text + '<small>' + when(e.at) + '</small></span></li>';
  }).join('') + '</ul>';
}

function render() {
  const sc = scored();
  const n = sc.filter(x => x.s.thirsty).length;
  $('#dateline').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  $('#lede').textContent = !ready ? 'Loading your garden…' : !plants.length ? 'No plants yet.'
    : n === 0 ? 'Everyone has had a drink today.' : n + (n === 1 ? ' plant is' : ' plants are') + ' thirsty.';
  $('#waterAll').hidden = !ready || n === 0;
  $('#rain').hidden = !ready || !plants.length;
  $('#meName').textContent = ls.get(WHO_KEY) || 'Your name';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === view)));
  $('#app').innerHTML = view === 'plants' ? plantsView(sc) : logView();
}

function banner(html, kind) {
  $('#banner').innerHTML = html ? '<div class="banner ' + (kind || '') + '">' + html + '</div>' : '';
}
function showError(err) {
  console.error(err);
  const c = (err && err.code) || '';
  const raw = String((err && err.message) || err || '');
  let msg = 'Something went wrong talking to the garden database.';
  if (c === 'permission-denied' && /has not been used|disabled/i.test(raw)) msg = 'The Firestore API is not turned on for this project. In Firebase, open Build > Firestore Database and create the database.';
  else if (c === 'permission-denied') msg = 'The garden database said no. Check that the security rules from the README are published.';
  else if (c === 'not-found') msg = 'No Firestore database was found. In Firebase, open Build > Firestore Database and click Create database (not Realtime Database).';
  else if (c === 'unavailable') msg = 'Cannot reach the garden database right now. Check your connection.';
  else if (/import|fetch|module|Failed to load/i.test(raw)) msg = 'Could not load Firebase. Check your connection and firebase-config.js.';
  banner(esc(msg) + '<br><small>Details: ' + esc((c ? c + ': ' : '') + raw.slice(0, 200)) + '</small>', 'warn');
}

function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button class="pill" data-act="undo">Undo</button>' : '');
  el.hidden = false; pendingUndo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; pendingUndo = null; }, 6000);
}
function pour() {
  const h = $('#hero'); h.classList.remove('pouring'); void h.offsetWidth; h.classList.add('pouring');
}

/* ---------- actions ---------- */
function water(ids, kind) {
  if (!store || !ids.length) return;
  const t = today(), who = ls.get(WHO_KEY) || '', prev = {}, patch = {}, logIds = [];
  ids.forEach(id => { const p = byId(id); if (p) { prev[id] = { lastWatered: p.lastWatered || '' }; patch[id] = { lastWatered: t }; } });
  const names = ids.map(id => (byId(id) || {}).name);
  pour();
  try {
    store.patchPlants(patch);
    if (kind === 'rain') logIds.push(store.addLog({ type: 'rain', by: who, day: t, plants: ids.length }));
    else ids.forEach((id, i) => logIds.push(store.addLog({ type: 'water', by: who, day: t, plantId: id, plantName: names[i] })));
  } catch (err) { showError(err); return; }
  const msg = kind === 'rain' ? 'Counted the rain for ' + ids.length + ' plant' + (ids.length === 1 ? '' : 's')
    : ids.length === 1 ? 'Watered ' + names[0] : 'Watered ' + ids.length + ' plants';
  toast(msg, () => { try { store.patchPlants(prev); logIds.forEach(i => store.deleteLog(i)); } catch (err) { showError(err); } });
}

function openPlant(id) {
  const p = id ? byId(id) : { name: '', icon: 'sprout', lifeCycle: 'Perennial', frost: false, planted: today(), location: '',
    everyEstablishing: 3, establishDays: 28, everyEstablished: 7, lastWatered: '', notes: '' };
  if (!p) return;
  const f = $('#plantForm'); f.reset(); const e = f.elements;
  e.pid.value = id || '';
  e.pname.value = p.name || '';
  e.picon.value = ICONS.some(i => i[0] === p.icon) ? p.icon : 'sprout';
  e.pcycle.value = p.lifeCycle || 'Unsure';
  e.pplanted.value = p.planted || '';
  e.pfrost.checked = !!p.frost;
  e.plocation.value = p.location || '';
  e.pest.value = p.everyEstablishing; e.pdays.value = p.establishDays; e.pset.value = p.everyEstablished;
  e.plast.value = p.lastWatered || '';
  e.pnotes.value = p.notes || '';
  $('#plantTitle').textContent = id ? 'Edit plant' : 'Add a plant';
  $('#deletePlant').hidden = !id;
  openD($('#plantDialog'));
}

function openSettings() {
  const e = $('#settingsForm').elements;
  e.swho.value = ls.get(WHO_KEY) || '';
  $('#codeBlock').hidden = !configured;
  if (configured) e.scode.value = ls.get(CODE_KEY) || '';
  openD($('#settingsDialog'));
}
function inviteLink() {
  const code = cleanCode($('#settingsForm').elements.scode.value);
  return location.origin + location.pathname + '#garden=' + encodeURIComponent(code);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-close]');
  if (!b) return;
  if (b.hasAttribute('data-close')) { closeD(b.closest('dialog')); return; }
  const card = b.closest('[data-id]'), id = card && card.dataset.id;
  switch (b.dataset.act) {
    case 'toggle': openIds.has(id) ? openIds.delete(id) : openIds.add(id); render(); break;
    case 'water': water([id], 'water'); break;
    case 'edit': openPlant(id); break;
    case 'water-all': water(scored().filter(x => x.s.thirsty).map(x => x.p.id), 'water'); break;
    case 'rain': water(plants.map(p => p.id), 'rain'); break;
    case 'tab': view = b.dataset.view; render(); break;
    case 'add': openPlant(null); break;
    case 'settings': openSettings(); break;
    case 'undo': if (pendingUndo) { const u = pendingUndo; pendingUndo = null; $('#toast').hidden = true; u(); } break;
  }
});

$('#plantForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.elements;
  const num = (el, d, min) => Math.max(min, parseInt(el.value, 10) || d);
  const p = {
    name: f.pname.value.trim() || 'New plant', icon: f.picon.value || 'sprout', lifeCycle: f.pcycle.value, frost: f.pfrost.checked,
    planted: f.pplanted.value || today(), location: f.plocation.value.trim(),
    everyEstablishing: num(f.pest, 3, 1), establishDays: num(f.pdays, 28, 0), everyEstablished: num(f.pset, 7, 1),
    lastWatered: f.plast.value || '', notes: f.pnotes.value.trim()
  };
  if (f.pid.value) p.id = f.pid.value;
  closeD($('#plantDialog'));
  if (store) { try { store.savePlant(p); } catch (err) { showError(err); } }
});
$('#deletePlant').addEventListener('click', () => {
  const id = $('#plantForm').elements.pid.value, p = byId(id);
  if (p && confirm('Remove ' + p.name + ' from the garden?')) {
    closeD($('#plantDialog'));
    try { store.deletePlant(id); } catch (err) { showError(err); }
  }
});

$('#settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.elements;
  ls.set(WHO_KEY, f.swho.value.trim());
  if (configured) {
    let code = cleanCode(f.scode.value);
    if (!code) code = makeCode();
    if (code.length < 8) { $('#codeMsg').textContent = 'Use at least 8 letters or numbers, or tap Make a code.'; return; }
    const changed = code !== ls.get(CODE_KEY);
    ls.set(CODE_KEY, code);
    closeD($('#settingsDialog'));
    if (changed) { location.reload(); return; }
  } else closeD($('#settingsDialog'));
  render();
});
$('#makeCode').addEventListener('click', () => { $('#settingsForm').elements.scode.value = makeCode(); });
$('#copyInvite').addEventListener('click', async () => {
  const code = cleanCode($('#settingsForm').elements.scode.value);
  if (code.length < 8) { $('#settingsForm').elements.scode.focus(); return; }
  const link = inviteLink();
  try {
    if (navigator.share) await navigator.share({ title: 'Patio Garden', url: link });
    else { await navigator.clipboard.writeText(link); toast('Invite link copied'); }
  } catch (err) { window.prompt('Copy this invite link:', link); }
});

/* ---------- boot ---------- */
function onPlants(arr) { plants = arr; ready = true; render(); }
function onLog(arr) { logs = arr; if (view === 'log') render(); }

(function buildIconPicker() {
  $('#iconPick').innerHTML = ICONS.map(i =>
    '<label class="ico"><input type="radio" name="picon" value="' + i[0] + '" aria-label="' + i[1] + '"><span><svg class="ic"><use href="#i-' + i[0] + '"/></svg></span></label>').join('');
})();

async function boot() {
  const m = location.hash.match(/garden=([^&]+)/);
  if (m) {
    ls.set(CODE_KEY, cleanCode(decodeURIComponent(m[1])));
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  render();
  if (!configured) {
    banner('Preview mode: changes stay on this device. Add your Firebase settings in firebase-config.js to share the garden between phones.');
    store = createLocalStore(); store.start(onPlants, onLog);
    if (!ls.get(WHO_KEY)) openSettings();
    return;
  }
  const code = cleanCode(ls.get(CODE_KEY));
  if (code.length < 8) {
    banner('Enter a garden code to connect. <button class="pill ghost" data-act="settings">Set up</button>');
    openSettings(); return;
  }
  try {
    store = await createFirebaseStore(code);
    store.start(onPlants, onLog);
    if (!ls.get(WHO_KEY)) openSettings();
    setTimeout(() => {
      if (!ready && !$('#banner').innerHTML) banner('Still connecting to the garden database. If this stays, check that the Firestore database exists and the rules are published.', 'warn');
    }, 10000);
  } catch (err) { showError(err); }
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
})();
</script>
</body>
</html>
